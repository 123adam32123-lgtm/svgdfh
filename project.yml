name: StudyLens
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  StudyLens:
    type: application
    platform: iOS
    sources:
      - path: StudyLens
        excludes:
          - "Info.plist"
          - "StudyLens.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StudyLens
        INFOPLIST_FILE: StudyLens/Info.plist
        CODE_SIGN_ENTITLEMENTS: StudyLens/StudyLens.entitlements
    dependencies:
      - target: StudyLensShareExtension
        embed: true
  StudyLensShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: StudyLensShareExtension
        excludes:
          - "Info.plist"
          - "StudyLensShareExtension.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StudyLens.ShareExtension
        INFOPLIST_FILE: StudyLensShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: StudyLensShareExtension/StudyLensShareExtension.entitlements
        PRODUCT_NAME: StudyLensShareExtension
    dependencies:
      - framework: Social.framework
