 workflows:
    study_lens_ipa:
      name: StudyLens IPA
      max_build_duration: 60
      instance_type: mac_mini_m2

      environment:
        xcode: latest

      scripts:
        - name: Build unsigned iOS app
          script: |
            xcodebuild archive \
              -project "$CM_BUILD_DIR/StudyLens.xcodeproj" \
              -scheme "StudyLens" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$CM_BUILD_DIR/build/StudyLens.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

        - name: Package IPA
          script: |
            mkdir -p "$CM_BUILD_DIR/build/Payload"
            cp -R "$CM_BUILD_DIR/build/StudyLens.xcarchive/Products/Applications/StudyLens.app" "$CM_BUILD_DIR/build/
            Payload/"
            cd "$CM_BUILD_DIR/build"
            ditto -c -k --sequesterRsrc --keepParent Payload StudyLens-unsigned.ipa

      artifacts:
        - build/StudyLens-unsigned.ipa
        - /tmp/xcodebuild_logs/*.log
