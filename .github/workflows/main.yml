 name: Build unsigned IPA

  "on":
    workflow_dispatch:

  permissions:
    contents: read

  jobs:
    build:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4

        - name: Build app
          run: xcodebuild -project StudyLens.xcodeproj -scheme StudyLens -configuration Release -sdk iphoneos
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

        - name: Package IPA
          run: |
            mkdir -p Payload
            cp -R build/Build/Products/Release-iphoneos/StudyLens.app Payload/
            ditto -c -k --sequesterRsrc --keepParent Payload StudyLens-unsigned.ipa

        - uses: actions/upload-artifact@v4
          with:
            name: StudyLens-unsigned-ipa
            path: StudyLens-unsigned.ipa
